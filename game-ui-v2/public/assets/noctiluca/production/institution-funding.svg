<svg xmlns="http://www.w3.org/2000/svg" width="96" height="80" viewBox="0 0 96 80" shape-rendering="crispEdges">
  <!-- Funding Authority: stepped ledger vault, heavy base, visible allocation ports. -->
  <g fill="#10142A">
    <rect x="4" y="72" width="88" height="6"/>
    <rect x="8" y="47" width="80" height="26"/>
    <rect x="14" y="38" width="68" height="10"/>
    <rect x="21" y="29" width="54" height="10"/>
    <rect x="29" y="20" width="38" height="10"/>
    <rect x="38" y="11" width="20" height="10"/>
    <rect x="43" y="5" width="10" height="7"/>
  </g>
  <g fill="#1A2140">
    <rect x="10" y="49" width="76" height="21"/>
    <rect x="16" y="40" width="64" height="7"/>
    <rect x="23" y="31" width="50" height="7"/>
    <rect x="31" y="22" width="34" height="7"/>
    <rect x="40" y="13" width="16" height="7"/>
  </g>
  <!-- Central hex-like vault is drawn as pixel stairs. -->
  <g fill="#46527A">
    <rect x="36" y="43" width="24" height="4"/>
    <rect x="31" y="47" width="34" height="20"/>
    <rect x="36" y="67" width="24" height="4"/>
  </g>
  <g fill="#070814">
    <rect x="38" y="49" width="20" height="18"/>
    <rect x="34" y="53" width="28" height="10"/>
  </g>
  <g fill="#39F5C8">
    <rect x="40" y="51" width="16" height="14"/>
    <rect x="36" y="55" width="24" height="6"/>
  </g>
  <g fill="#EEE9D8">
    <rect x="45" y="50" width="6" height="16"/>
    <rect x="39" y="56" width="18" height="4"/>
  </g>
  <rect x="46" y="54" width="4" height="8" fill="#FFC857"/>
  <!-- Application intake at left, transparent allocation ledger at right. -->
  <g fill="#2A3560">
    <rect x="12" y="52" width="16" height="15"/>
    <rect x="68" y="52" width="16" height="15"/>
    <rect x="26" y="33" width="44" height="4"/>
  </g>
  <g fill="#EEE9D8">
    <rect x="15" y="55" width="10" height="2"/>
    <rect x="15" y="60" width="8" height="2"/>
    <rect x="15" y="65" width="11" height="2"/>
  </g>
  <g fill="#2DD4FF">
    <rect x="71" y="55" width="10" height="2"/>
    <rect x="71" y="60" width="6" height="2"/>
    <rect x="71" y="65" width="12" height="2"/>
  </g>
  <!-- Allocation ports make resources visibly leave the institution. -->
  <g fill="#B7F34A">
    <rect x="6" y="55" width="4" height="5"/>
    <rect x="86" y="52" width="6" height="5"/>
    <rect x="86" y="63" width="6" height="5"/>
    <rect x="47" y="7" width="2" height="4"/>
  </g>
  <g fill="#FFC857">
    <rect x="32" y="24" width="4" height="3"/>
    <rect x="40" y="24" width="4" height="3"/>
    <rect x="48" y="24" width="4" height="3"/>
    <rect x="56" y="24" width="4" height="3"/>
  </g>
  <g fill="#704154">
    <rect x="17" y="42" width="4" height="4"/>
    <rect x="75" y="42" width="4" height="4"/>
    <rect x="8" y="69" width="80" height="3"/>
  </g>
</svg>
